schema_variable_name: "mntn_schema"

include_databricks_sql: false
include_sqlserver: false
include_duckdb: true
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "toggle vars"
    vars:
      mntn__using_creative_group: false
      mntn__using_campaign_info: false
      mntn__using_creative: false
      mntn__using_creative_info: false
      mntn__using_ad_info: false
      mntn__using_analytics_by_country: false
      mntn__using_analytics_by_state: false
    include_incremental: false

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true