      - name: segment
        identifier: "{{ var('mntn_segment_identifier', 'segment') }}"
        description: Daily audience/targeting-segment performance metrics — MNTN's audience concept, with no equivalent in other ad platforms. Five columns (site_visitor, existing_site_visitor, new_site_visitor, existing_user_reached, new_user_reached) were added in June 2026 and are singular, unlike the plural convention (*_visitors, *_reached) used on every other MNTN table — do not assume name parity when comparing to other tables.
        columns:
          - name: day
            description: "{{ doc('date_day') }}"
          - name: id
            description: Unique identifier for the audience segment.
          - name: name
            description: Name of the audience segment.
          - name: impressions
            description: "{{ doc('impressions') }}"
          - name: multi_touch_impressions
            description: Impressions attributed under MNTN's multi-touch (assisted) attribution model.
          - name: multi_touch_spend
            description: Spend attributed under MNTN's multi-touch (assisted) attribution model.
          - name: tv_commercials_aired
            description: Number of linear TV commercial airings.
          - name: tv_spend
            description: Spend specific to linear TV commercial airings, as distinct from streaming/CTV inventory.
          - name: visits
            description: "{{ doc('clicks') }}"
          - name: visit_rate
            description: Visits divided by total impressions.
          - name: impression_visit_rate
            description: Visits divided by impressions delivered.
          - name: site_visitor
            description: Unique visitors driven to the advertiser's site. Note - singular column name in the MNTN source, unlike site_visitors elsewhere in the schema; represents the same concept.
          - name: new_site_visitor
            description: Unique site visitors who had not visited the site before. Note - singular column name in the MNTN source, unlike new_site_visitors elsewhere in the schema; represents the same concept.
          - name: existing_site_visitor
            description: Unique site visitors who had visited the site before. Note - singular column name in the MNTN source, unlike existing_site_visitors elsewhere in the schema; represents the same concept.
          - name: users_reached
            description: Unique individuals reached by the ad.
          - name: new_user_reached
            description: Unique individuals reached who had not been reached before. Note - singular column name in the MNTN source, unlike new_users_reached elsewhere in the schema; represents the same concept.
          - name: existing_user_reached
            description: Unique individuals reached who had been reached before. Note - singular column name in the MNTN source, unlike existing_users_reached elsewhere in the schema; represents the same concept.
          - name: frequency
            description: Average number of times a household or user was exposed to the ad.
          - name: user_visit_rate
            description: Visit rate calculated against users reached rather than impressions.
          - name: user_conversion_rate
            description: Conversion rate calculated against users reached rather than impressions.
          - name: conversions
            description: "{{ doc('conversions') }}"
          - name: conversion_rate
            description: Conversions divided by total impressions.
          - name: impression_conversion_rate
            description: Conversions divided by impressions delivered.
          - name: visit_conversion_rate
            description: Conversions divided by site visits.
          - name: order_value
            description: "{{ doc('conversions_value') }}"
          - name: average_order_value
            description: Average order value per conversion.
          - name: spend
            description: "{{ doc('spend') }}"
          - name: cost_per_visit
            description: Spend divided by site visits.
          - name: cpa
            description: Cost per acquisition, as calculated by MNTN (spend divided by conversions).
          - name: roas
            description: Return on ad spend, as calculated by MNTN.
          - name: roi
            description: Return on investment, as calculated by MNTN.

      - name: segment_info
        identifier: "{{ var('mntn_segment_info_identifier', 'segment_info') }}"
        description: Daily metadata snapshot for audience segments, including the segment's interest category and description.
        columns:
          - name: day
            description: "{{ doc('date_day') }}"
          - name: segment_id
            description: Unique identifier for the audience segment.
          - name: name
            description: Name of the audience segment.
          - name: description
            description: Description of the audience segment.
          - name: interest
            description: Interest category associated with the audience segment.
