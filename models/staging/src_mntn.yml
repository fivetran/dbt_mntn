version: 2

sources:
  - name: mntn
    schema: "{{ var('mntn_schema', 'mntn') }}"
    database: "{% if target.type != 'spark' %}{{ var('mntn_database', target.database) }}{% endif %}"

    tables:
      - name: advertiser
        identifier: "{{ var('mntn_advertiser_identifier', 'advertiser') }}"
        description: Daily account-level performance metrics for the MNTN advertiser account. The most granular field set of any table, including raw (unmodeled) and attribution-percentage variants unique to this grain.
        columns:
          - name: day
            description: "{{ doc('date_day') }}"
          - name: id
            description: "{{ doc('account_id') }}"
          - name: name
            description: "{{ doc('account_name') }}"
          - name: impressions
            description: "{{ doc('impressions') }}"
          - name: viewable_impressions
            description: Number of impressions that met MNTN's viewability threshold.
          - name: viewable_impression_rate
            description: Viewable impressions divided by total impressions.
          - name: completed_views
            description: Number of TV commercial views that played to completion.
          - name: completed_view_rate
            description: Completed views divided by total impressions.
          - name: multi_touch_impressions
            description: Impressions attributed under MNTN's multi-touch (assisted) attribution model.
          - name: multi_touch_spend
            description: Spend attributed under MNTN's multi-touch (assisted) attribution model.
          - name: tv_commercials_aired
            description: Number of linear TV commercial airings.
          - name: tv_spend
            description: Spend specific to linear TV commercial airings, as distinct from streaming/CTV inventory.
          - name: visits
            description: "{{ doc('clicks') }}"
          - name: visit_rate
            description: Visits divided by total impressions.
          - name: impression_visit_rate
            description: Visits divided by impressions delivered.
          - name: site_visitors
            description: Unique visitors driven to the advertiser's site.
          - name: new_site_visitors
            description: Unique site visitors who had not visited the site before.
          - name: existing_site_visitors
            description: Unique site visitors who had visited the site before.
          - name: page_views
            description: Total page views generated on the advertiser's site following ad exposure.
          - name: average_page_views_per_visitor
            description: Average number of page views per site visitor.
          - name: users_reached
            description: Unique individuals reached by the ad.
          - name: new_users_reached
            description: Unique individuals reached who had not been reached before.
          - name: existing_users_reached
            description: Unique individuals reached who had been reached before.
          - name: frequency
            description: Average number of times a household or user was exposed to the ad.
          - name: user_visit_rate
            description: Visit rate calculated against users reached rather than impressions.
          - name: user_conversion_rate
            description: Conversion rate calculated against users reached rather than impressions.
          - name: conversions
            description: "{{ doc('conversions') }}"
          - name: raw_conversions
            description: Unmodeled conversion count, prior to MNTN's attribution modeling.
          - name: conversion_rate
            description: Conversions divided by total impressions.
          - name: raw_conversion_rate
            description: Unmodeled conversion rate, prior to MNTN's attribution modeling.
          - name: impression_conversion_rate
            description: Conversions divided by impressions delivered.
          - name: visit_conversion_rate
            description: Conversions divided by site visits.
          - name: percentage_of_conversions
            description: Share of the account's total conversions attributed to this row.
          - name: conversion_attribution_percentage
            description: Percentage of conversions MNTN's attribution model credits to this channel or tactic.
          - name: raw_existing_site_visitors
            description: Unmodeled count of existing site visitors, prior to MNTN's attribution modeling.
          - name: raw_new_site_visitors
            description: Unmodeled count of new site visitors, prior to MNTN's attribution modeling.
          - name: order_value
            description: "{{ doc('conversions_value') }}"
          - name: raw_order_value
            description: Unmodeled order value, prior to MNTN's attribution modeling.
          - name: average_order_value
            description: Average order value per conversion.
          - name: raw_average_order_value
            description: Unmodeled average order value, prior to MNTN's attribution modeling.
          - name: percentage_of_order_value
            description: Share of the account's total order value attributed to this row.
          - name: order_value_attribution_percentage
            description: Percentage of order value MNTN's attribution model credits to this channel or tactic.
          - name: spend
            description: "{{ doc('spend') }}"
          - name: cost_per_visit
            description: Spend divided by site visits.
          - name: cost_per_completed_view
            description: Spend divided by completed views.
          - name: cpa
            description: Cost per acquisition, as calculated by MNTN (spend divided by conversions).
          - name: roas
            description: Return on ad spend, as calculated by MNTN.
          - name: roi
            description: Return on investment, as calculated by MNTN.

      - name: advertiser_info
        identifier: "{{ var('mntn_advertiser_info_identifier', 'advertiser_info') }}"
        description: Daily metadata snapshot for the MNTN advertiser account. No metrics — contact and account profile fields only.
        columns:
          - name: day
            description: "{{ doc('date_day') }}"
          - name: advertiser_id
            description: "{{ doc('account_id') }}"
          - name: name
            description: "{{ doc('account_name') }}"
          - name: contact_first_name
            description: First name of the advertiser account's primary contact.
          - name: contact_last_name
            description: Last name of the advertiser account's primary contact.
          - name: contact_email
            description: Email address of the advertiser account's primary contact.
          - name: contact_mobile_phone
            description: Mobile phone number of the advertiser account's primary contact.
          - name: contact_office_phone
            description: Office phone number of the advertiser account's primary contact.
          - name: time_zone
            description: Time zone configured for the advertiser account.
          - name: create_time
            description: Timestamp when the advertiser account was created.

      - name: campaign_group
        identifier: "{{ var('mntn_campaign_group_identifier', 'campaign_group') }}"
        description: Daily campaign-level performance metrics. MNTN's documented preferred grain for campaign-level reporting — there is no separate metrics-bearing "campaign" table.
