          - name: cost_per_completed_view
            description: Spend divided by completed views.
          - name: cpa
            description: Cost per acquisition, as calculated by MNTN (spend divided by conversions).
          - name: roas
            description: Return on ad spend, as calculated by MNTN.
          - name: roi
            description: Return on investment, as calculated by MNTN.

      - name: campaign_info
        identifier: "{{ var('mntn_campaign_info_identifier', 'campaign_info') }}"
        description: Daily metadata snapshot at the campaign_id grain, including flight scheduling and status. Added by MNTN in February 2026 to replace campaign_group_info. Relationship of campaign_id to campaign_group_id is unconfirmed — see the package README for details.
        columns:
          - name: day
            description: "{{ doc('date_day') }}"
          - name: campaign_id
            description: Unique identifier for the campaign, at MNTN's finer campaign_id grain (distinct from campaign_group_id — see the package README).
          - name: name
            description: "{{ doc('campaign_name') }}"
          - name: status
            description: Current status of the campaign (e.g. active, paused, ended).
          - name: start_time
            description: Timestamp when the campaign was created in MNTN.
          - name: end_time
            description: Timestamp when the campaign was ended in MNTN.
          - name: flight_start_time
            description: Scheduled start of the campaign's flight (the date range during which it is set to deliver).
          - name: flight_end_time
            description: Scheduled end of the campaign's flight (the date range during which it is set to deliver).

      - name: creative_group
        identifier: "{{ var('mntn_creative_group_identifier', 'creative_group') }}"
        description: Daily ad-group-equivalent performance metrics — one TV commercial plus its tracking (and Multi-Touch group, if used).
