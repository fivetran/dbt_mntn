          - name: new_site_visitors
            description: Unique site visitors who had not visited the site before.
          - name: existing_site_visitors
            description: Unique site visitors who had visited the site before.
          - name: users_reached
            description: Unique individuals reached by the ad.
          - name: new_users_reached
            description: Unique individuals reached who had not been reached before.
          - name: existing_users_reached
            description: Unique individuals reached who had been reached before.
          - name: frequency
            description: Average number of times a household or user was exposed to the ad.
          - name: user_visit_rate
            description: Visit rate calculated against users reached rather than impressions.
          - name: user_conversion_rate
