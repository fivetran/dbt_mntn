      - name: creative_info
        identifier: "{{ var('mntn_creative_info_identifier', 'creative_info') }}"
        description: Daily metadata snapshot at the creative_id grain, including the creative's click-through tracking URL. Rebuilt by MNTN in February 2026.
        columns:
          - name: day
            description: "{{ doc('date_day') }}"
          - name: creative_id
            description: "{{ doc('ad_id') }}"
          - name: name
            description: "{{ doc('ad_name') }}"
          - name: active
            description: Whether the creative is currently active.
          - name: click_url
            description: The creative's destination URL, including any tracking parameters appended by MNTN.

      - name: ad_info
        identifier: "{{ var('mntn_ad_info_identifier', 'ad_info') }}"
        description: Daily metadata snapshot at the creative_id grain covering ad-serving tag attributes. Same grain as creative_info (day, creative_id) — a different metadata facet, not a deeper level. Added by MNTN in February 2026.
        columns:
          - name: day
            description: "{{ doc('date_day') }}"
          - name: creative_id
            description: "{{ doc('ad_id') }}"
          - name: name
            description: "{{ doc('ad_name') }}"
          - name: ad_code
            description: The ad-serving tag code associated with the creative.
          - name: active
            description: Whether the ad-serving tag is currently active.
          - name: approved
            description: Whether the ad-serving tag has been approved.
          - name: status
            description: Current status of the ad-serving tag.
          - name: width
            description: Width, in pixels, of the ad-serving tag.
          - name: height
            description: Height, in pixels, of the ad-serving tag.
          - name: create_time
            description: Timestamp when the ad-serving tag was created.

